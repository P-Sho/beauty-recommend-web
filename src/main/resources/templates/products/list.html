<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>화장품 목록</title>
    <style>
        body { font-family: sans-serif; margin: 24px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 6px 8px; font-size: 14px; }
        th { background: #f5f5f5; }
        td.num { text-align: right; }
    </style>
</head>
<body>
<h1>화장품 목록 (<span th:text="${#lists.size(products)}">0</span>개)</h1>

<!-- TODO(2주차): 검색 폼(피부타입/퍼스널컬러/종류/이름) + 페이징 -->

<table>
    <thead>
    <tr>
        <th>ID</th><th>제품명</th><th>종류</th><th>분류</th>
        <th>피부타입</th><th>퍼스널컬러</th><th>가격</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}">1</td>
        <!-- TODO(1주차): 제품명을 상세 화면 링크로 -->
        <td th:text="${p.name}">제품명</td>
        <td th:text="${p.itemType}">쿠션</td>
        <td th:text="${p.category}">베이스</td>
        <td th:text="${p.skinType} ?: '-'">지성</td>
        <td th:text="${p.personalColor} ?: '-'">봄웜</td>
        <td class="num" th:text="${#numbers.formatInteger(p.price, 0, 'COMMA')} + '원'">10,000원</td>
    </tr>
    </tbody>
</table>
</body>
</html>
